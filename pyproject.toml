[project]
name = "shapewright-mcp"
version = "0.1.0"
description = "An MCP server that makes parametric 3D design (build123d) easy for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ananda Satria", email = "putu.satriaadi@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "cad", "3d-printing", "build123d", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "build123d>=0.13.0",
    "mcp>=2.3.0",
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.scripts]
shapewright-mcp = "shapewright.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shapewright"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    # not used by shapewright; kept so unrelated scratch scripts in this
    # workspace keep working (see .gitignore)
    "matplotlib>=3.11.2",
]
